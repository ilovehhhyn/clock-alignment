<title>Blood and ___ on the Clock Tower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Landing: a pinned stage. Back to front: the title on blush paper, the checkerboard that scrolls away, the hands that never move.
   The checkerboard tile is one diamond wide: black quarter-diamonds in its corners, one light diamond in its centre. */
:root { --board-dark: #13160e; --board-light: #bdb3b2; }
body { background: var(--blush); overflow-x: hidden; }
.hero { height: 240svh; position: relative; }
.stage { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--blush); }
.title-layer {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) clamp(1.2rem, 4svh, 3rem) max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
}
.title-block { display: flex; flex-direction: column; align-items: center; gap: .3rem; max-width: 100%; will-change: transform, opacity; }
.title-block .title { width: min(62vw, 880px); height: auto; display: block; }
.title-block .subtitle { font-family: var(--display); font-style: italic; font-size: clamp(1rem, 1.9vw, 1.35rem); color: var(--ink-soft); margin: .1rem 0 0; }
.board {
  position: absolute; inset: 0; z-index: 2; will-change: transform; background-color: var(--board-light);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 2' shape-rendering='crispEdges'><rect width='2' height='2' fill='%2313160e'/><polygon points='1,0 2,1 1,2 0,1' fill='%23bdb3b2'/></svg>");
  background-size: 292px 292px; background-repeat: repeat;
}
.board::after { content: ""; position: absolute; inset: 0; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='0.5'/></svg>"); mix-blend-mode: soft-light; opacity: .35; pointer-events: none; }
.hands { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 78%; width: auto; z-index: 3; pointer-events: none; user-select: none; }
@media (max-aspect-ratio: 1/1) { .hands { height: auto; width: 100%; } .title-block .title { width: min(86vw, 880px); } }
.scroll-hint {
  position: absolute; left: 0; right: 0; bottom: max(1rem, env(safe-area-inset-bottom, 0px)); z-index: 4; text-align: center; pointer-events: none;
  font-family: var(--smallcaps); letter-spacing: .25em; font-size: .8rem; color: #fff; mix-blend-mode: difference;
}
.landing-nav { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 4; display: flex; justify-content: flex-end; gap: 1.4rem; padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 0; font-family: var(--smallcaps); letter-spacing: .12em; font-size: .9rem; color: #fff; mix-blend-mode: difference; }
.landing-nav a { text-decoration: none; }
.landing-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
footer.colophon { text-align: center; font-family: var(--display); font-style: italic; color: var(--ink-faint); padding: 2rem 1rem 3rem; font-size: 1rem; }
@media (prefers-reduced-motion: reduce) {
  .hero { height: 100svh; }
  .board { display: none; }
  .scroll-hint { display: none; }
}
</style>

<header class="hero" id="hero">
  <div class="stage">
    <section class="title-layer" aria-label="Title">
      <div class="title-block" id="title-block">
        <img class="title" src="assets/title.png" alt="Blood and ___ on the Clock Tower">
        <p class="subtitle">Alignment benchmark</p>
        <nav class="doors" aria-label="Sections">
          <a href="overview.html">Overview</a>
          <a href="characters.html">Characters</a>
          <a href="results.html">Results</a>
        </nav>
      </div>
    </section>
    <div class="board" id="board" aria-hidden="true"></div>
    <img class="hands" id="hands" src="assets/hands-foreground.png" alt="" aria-hidden="true" decoding="async">
    <nav class="landing-nav" aria-label="Sections">
      <a href="overview.html">Overview</a><a href="characters.html">Characters</a><a href="results.html">Results</a>
    </nav>
    <div class="scroll-hint" id="scroll-hint">Scroll to enter</div>
  </div>
</header>
<footer class="colophon">An alignment benchmark played on a hidden-role game by language models.</footer>

<script>
(function () {
  // Geometry of the reference image: the hands PNG is 736 px square; a diamond is 292 px wide; a black diamond is centred at (218, 644.5).
  var IMAGE_PX = 736, DIAMOND_PX = 292, BLACK_CENTRE = { x: 218, y: 644.5 };
  var REVEAL = { titleStart: 0.3, titleEnd: 0.9, hintUntil: 0.04 };
  var hero = document.getElementById('hero'), stage = hero.querySelector('.stage');
  var board = document.getElementById('board'), hands = document.getElementById('hands');
  var title = document.getElementById('title-block'), hint = document.getElementById('scroll-hint');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ticking = false;
  function clamp(value, low, high) { return Math.min(high, Math.max(low, value)); }
  function mod(value, size) { return ((value % size) + size) % size; }
  function layoutBoard() {
    var rect = hands.getBoundingClientRect(), stageRect = stage.getBoundingClientRect();
    if (rect.width === 0) { return; }
    var scale = rect.width / IMAGE_PX, diamond = DIAMOND_PX * scale;
    var x = rect.left - stageRect.left + BLACK_CENTRE.x * scale, y = rect.top - stageRect.top + BLACK_CENTRE.y * scale;
    board.style.backgroundSize = diamond + 'px ' + diamond + 'px';
    board.style.backgroundPosition = mod(x, diamond) + 'px ' + mod(y, diamond) + 'px';
  }
  function progress() {
    var travel = hero.offsetHeight - stage.offsetHeight;
    return travel <= 0 ? 1 : clamp((window.scrollY - hero.offsetTop) / travel, 0, 1);
  }
  function render() {
    ticking = false;
    var p = progress();
    board.style.transform = 'translate3d(0,' + (-p * 100) + '%,0)';
    var t = clamp((p - REVEAL.titleStart) / (REVEAL.titleEnd - REVEAL.titleStart), 0, 1);
    title.style.opacity = String(0.2 + 0.8 * t);
    title.style.transform = 'translateY(' + (22 * (1 - t)) + 'px)';
    hint.style.opacity = p < REVEAL.hintUntil ? '1' : '0';
  }
  function schedule() { if (!ticking) { ticking = true; window.requestAnimationFrame(render); } }
  if (reduced) { title.style.opacity = '1'; return; }
  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', function () { layoutBoard(); schedule(); });
  if (hands.complete) { layoutBoard(); } else { hands.addEventListener('load', layoutBoard); }
  render();
})();
</script>
